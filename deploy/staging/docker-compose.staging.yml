# Staging stack on the Hetzner server. The deploy job copies this file, the Caddyfile,
# deploy.sh and a generated .env into the deploy directory and runs deploy.sh.
# Every ${VAR} below comes from that .env (see DEPLOY.md).
name: nolon-staging

x-database-url: &database-url postgresql://nolon:${POSTGRES_PASSWORD:?}@postgres:5432/nolon?schema=public

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nolon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: nolon
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nolon -d nolon']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off jobs, not a running service: `migrate deploy` by default, the demo seed on request.
  migrate:
    image: ${MIGRATE_IMAGE:?}
    profiles: [jobs]
    environment:
      DATABASE_URL: *database-url
      ALLOW_DEMO_SEED: 'true'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${API_IMAGE:?}
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      CORS_ORIGINS: https://${SITE_DOMAIN:?}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:?}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?}
      BASIC_AUTH: ${BASIC_AUTH:-off}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
