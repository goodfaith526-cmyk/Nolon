# Staging stack on the Hetzner server. The deploy job copies this file, the Caddyfile,
# deploy.sh and a generated .env into the deploy directory and runs deploy.sh.
# Every ${VAR} below comes from that .env (see DEPLOY.md).
# The project name keeps containers, the network and volumes prefixed `nolon-staging`, apart from
# anything else running on the server.
name: nolon-staging

x-database-url: &database-url postgresql://nolon:${POSTGRES_PASSWORD:?}@postgres:5432/nolon?schema=public

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nolon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: nolon
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nolon -d nolon']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off jobs, not a running service: `migrate deploy` by default, the demo seed on request.
  migrate:
    image: ${MIGRATE_IMAGE:?}
    profiles: [jobs]
    environment:
      DATABASE_URL: *database-url
      ALLOW_DEMO_SEED: 'true'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${API_IMAGE:?}
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      CORS_ORIGINS: https://${SITE_DOMAIN:?}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:?}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Defaults publish 80/443 to the internet. Behind an existing proxy, the .env binds them to
    # local ports instead (HTTP_BIND=127.0.0.1:8080, HTTPS_BIND=127.0.0.1:8443).
    ports:
      - '${HTTP_BIND:-80}:80'
      - '${HTTPS_BIND:-443}:443'
      - '${HTTPS_BIND:-443}:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
      BASIC_AUTH: ${BASIC_AUTH:?BASIC_AUTH must be on or off}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
