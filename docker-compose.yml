# Local development database only. Staging/production hosting is configured separately.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nolon
      POSTGRES_PASSWORD: nolon
      POSTGRES_DB: nolon
    ports:
      - '5432:5432'
    volumes:
      - nolon-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nolon -d nolon']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nolon-pg:
