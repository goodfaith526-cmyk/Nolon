name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Migrations and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nolon
          POSTGRES_PASSWORD: nolon
          POSTGRES_DB: nolon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nolon -d nolon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nolon:nolon@localhost:5432/nolon?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Existing migrations are not modified
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --diff-filter=MDR "origin/${{ github.base_ref }}...HEAD" -- apps/api/prisma/migrations)
          if [ -n "$changed" ]; then
            echo "::error::Migrations already on ${{ github.base_ref }} were modified or deleted. Add a new migration instead:"
            echo "$changed"
            exit 1
          fi
      - name: Apply migrations to an empty database
        run: pnpm db:deploy
      - name: Schema matches migrations (no drift)
        run: pnpm db:check
      - run: pnpm test:integration

  deploy-artifacts:
    name: Deploy artifacts (images, Compose, Caddy, workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build api image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: api
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build migrate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          cache-from: |
            type=gha,scope=api
            type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max
      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Compose file is valid (both proxy modes)
        working-directory: deploy/staging
        run: |
          base='API_IMAGE=api
          WEB_IMAGE=web
          MIGRATE_IMAGE=migrate
          POSTGRES_PASSWORD=x
          SITE_DOMAIN=staging.example.com
          BASIC_AUTH=on'
          printf '%s\n%s\n' "$base" 'SITE_ADDRESS=staging.example.com' > .env
          docker compose -f docker-compose.staging.yml --profile jobs config --quiet
          # Without BASIC_AUTH the file must not resolve (never public by default).
          grep -v '^BASIC_AUTH=' .env > .env.noauth && mv .env.noauth .env
          if docker compose -f docker-compose.staging.yml --profile jobs config --quiet 2>/dev/null; then
            echo "::error::compose accepted a missing BASIC_AUTH"; exit 1
          fi
          printf '%s\n%s\n' "$base" 'SITE_ADDRESS=:80
          HTTP_BIND=127.0.0.1:8090
          HTTPS_BIND=127.0.0.1:8091' > .env
          docker compose -f docker-compose.staging.yml --profile jobs config --quiet
          rm .env
      - name: Caddyfile is valid (basic auth on and off) and fails closed
        run: |
          hash=$(docker run --rm caddy:2-alpine caddy hash-password --plaintext ci-only)
          validate() {
            docker run --rm -v "$PWD/deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro" \
              -e SITE_ADDRESS=:80 "$@" \
              caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          }
          validate -e BASIC_AUTH=on -e BASIC_AUTH_USER=ci -e BASIC_AUTH_HASH="$hash"
          validate -e BASIC_AUTH=off
          # A missing or unknown mode, or `on` without credentials, must be rejected.
          for args in "" "-e BASIC_AUTH=yes" "-e BASIC_AUTH=on" "-e BASIC_AUTH=on -e BASIC_AUTH_USER=ci"; do
            # shellcheck disable=SC2086 # $args is a list of docker flags
            if validate $args >/dev/null 2>&1; then
              echo "::error::Caddyfile accepted: ${args:-no BASIC_AUTH}"; exit 1
            fi
          done
      - name: Production Compose file and Caddyfile are valid
        working-directory: deploy/production
        run: |
          printf '%s\n' API_IMAGE=api WEB_IMAGE=web MIGRATE_IMAGE=migrate POSTGRES_PASSWORD=x \
            SITE_DOMAIN=erp.example.com LOCAL_PORT=8092 > .env
          docker compose -f docker-compose.production.yml --profile jobs config --quiet
          # Caddy is published on this machine only, never on a public address.
          if ! docker compose -f docker-compose.production.yml config --format json |
            jq -e '[.services[].ports // [] | .[]] | length == 1 and all(.host_ip == "127.0.0.1")'; then
            echo "::error::production must publish one port, on 127.0.0.1 only"; exit 1
          fi
          rm .env
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Production backup and restore round trip (deploy/production/test-backup.sh)
        run: deploy/production/test-backup.sh
      - name: Deploy scripts pass shellcheck
        run: shellcheck deploy/*/*.sh
      - name: Workflows and deploy.sh pass actionlint (with shellcheck)
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
