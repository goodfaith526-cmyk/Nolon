name: Deploy staging

# Deploys main to the staging server after CI has passed on it. Can also be run by hand from the
# Actions tab (Run workflow), from main only and only for a commit CI passed on. Setup and
# required secrets: DEPLOY.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running deploy instead of cutting it off.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read # to check CI passed on the commit of a manual run

jobs:
  deploy:
    name: Build images and deploy to staging
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ vars.STAGING_DOMAIN || 'staging.2-28-12-44.sslip.io' }}
    env:
      # The only place the staging address is set. Override with the STAGING_DOMAIN variable.
      SITE_DOMAIN: ${{ vars.STAGING_DOMAIN || 'staging.2-28-12-44.sslip.io' }}
      # Empty: our Caddy owns ports 80/443 and gets the certificate. A port number (e.g. 8080): the
      # server already has a reverse proxy on 80/443, so Caddy listens on 127.0.0.1:<port> only and
      # that proxy forwards SITE_DOMAIN to it (DEPLOY.md, "Behind an existing proxy").
      LOCAL_PORT: ${{ vars.STAGING_LOCAL_PORT }}
      DEPLOY_DIR: nolon-staging
      # Staging holds client data and is private by default. Set this repository variable to
      # `true` only to deliberately run it without basic auth.
      ALLOW_PUBLIC: ${{ vars.STAGING_ALLOW_PUBLIC }}
      # The staff AI assistant's address (e.g. https://pilot.example.com/?tenant=nolon). Empty: no
      # assistant button. Not secret.
      ASSISTANT_URL: ${{ vars.STAGING_AGENT_ASSISTANT_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The commit CI just passed on, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check required secrets
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          BASIC_AUTH_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          BASIC_AUTH_HASH: ${{ secrets.STAGING_BASIC_AUTH_HASH }}
          SEED_ADMIN_EMAIL: ${{ secrets.STAGING_SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.STAGING_SEED_ADMIN_PASSWORD }}
          BACKUP_AGE_RECIPIENT: ${{ vars.STAGING_BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_ENDPOINT: ${{ vars.STAGING_BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ vars.STAGING_BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ vars.STAGING_BACKUP_S3_REGION }}
          BACKUP_KEEP_DAYS: ${{ vars.STAGING_BACKUP_KEEP_DAYS }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.STAGING_BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.STAGING_BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          # Backups: all five settings, or none yet (deploy.sh then warns on every deploy). The
          # values themselves are checked on the server by backup-job.sh.
          set_count=0
          for name in BACKUP_AGE_RECIPIENT BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET \
            BACKUP_S3_ACCESS_KEY_ID BACKUP_S3_SECRET_ACCESS_KEY; do
            [ -z "${!name}" ] || set_count=$((set_count + 1))
          done
          if [ "$set_count" != 0 ] && [ "$set_count" != 5 ]; then
            echo "::error::Backups need all of STAGING_BACKUP_AGE_RECIPIENT, STAGING_BACKUP_S3_ENDPOINT, STAGING_BACKUP_S3_BUCKET (variables), STAGING_BACKUP_S3_ACCESS_KEY_ID and STAGING_BACKUP_S3_SECRET_ACCESS_KEY (secrets), or none of them"
            exit 1
          fi
          for name in BACKUP_AGE_RECIPIENT BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET BACKUP_S3_REGION \
            BACKUP_KEEP_DAYS BACKUP_S3_ACCESS_KEY_ID BACKUP_S3_SECRET_ACCESS_KEY; do
            case "${!name}" in
              *"'"* | *$'\n'*) echo "::error::STAGING_$name must not contain a quote or a line break"; exit 1 ;;
            esac
          done
          if [ "$set_count" = 0 ]; then
            echo "::warning::Staging backups are not set up: deploys migrate without a backup (DEPLOY.md, Backups)"
          fi
          missing=""
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS POSTGRES_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing STAGING_${name/SSH_KEY/SSH_PRIVATE_KEY}"
          done
          if [ "$ALLOW_PUBLIC" != "true" ]; then
            [ -n "$BASIC_AUTH_USER" ] || missing="$missing STAGING_BASIC_AUTH_USER"
            [ -n "$BASIC_AUTH_HASH" ] || missing="$missing STAGING_BASIC_AUTH_HASH"
          fi
          # The first Administrator: both secrets together, or staging has nobody who can sign in.
          [ -n "$SEED_ADMIN_EMAIL" ] || missing="$missing STAGING_SEED_ADMIN_EMAIL"
          [ -n "$SEED_ADMIN_PASSWORD" ] || missing="$missing STAGING_SEED_ADMIN_PASSWORD"
          case "$SEED_ADMIN_PASSWORD" in
            *"'"*) echo "::error::STAGING_SEED_ADMIN_PASSWORD must not contain a single quote"; exit 1 ;;
          esac
          if [ "${#SEED_ADMIN_PASSWORD}" -gt 0 ] && [ "${#SEED_ADMIN_PASSWORD}" -lt 12 ]; then
            echo "::error::STAGING_SEED_ADMIN_PASSWORD needs at least 12 characters"
            exit 1
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing (see DEPLOY.md)"
            exit 1
          fi

      - name: Check CI passed on this commit (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" \
            --status success --limit 1 --json databaseId --jq length)
          if [ "$ok" != 1 ]; then
            echo "::error::CI has not passed on $sha. Deploy only commits that are green on main."
            exit 1
          fi

      # Runs before any image is built, so a bad key or host fails in seconds.
      - name: Set up and check SSH
        id: ssh
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          install -m 700 -d ~/.ssh
          # Keys copied on Windows carry CRLF line endings, which OpenSSH rejects ("error in libcrypto").
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null; then
            echo "::error::STAGING_SSH_PRIVATE_KEY cannot be read as a private key. Paste the whole private key file (nolon-staging-deploy, not the .pub), from -----BEGIN OPENSSH PRIVATE KEY----- to -----END OPENSSH PRIVATE KEY-----, with its line breaks and no quotes."
            exit 1
          fi
          # Accepts known_hosts lines (`<host> ssh-ed25519 AAAA...`) or bare host public keys
          # (`ssh-ed25519 AAAA... root@server`); bare keys are pinned to STAGING_SSH_HOST. Comment and
          # blank lines are dropped. Where the key must come from: DEPLOY.md, step 3.
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' | while read -r line; do
            case "$line" in
              '' | '#'*) ;;
              ssh-* | ecdsa-*) echo "$SSH_HOST $line" ;;
              *) echo "$line" ;;
            esac
          done > ~/.ssh/known_hosts
          if ! ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::STAGING_SSH_KNOWN_HOSTS has no key for STAGING_SSH_HOST (DEPLOY.md, step 3)."
            exit 1
          fi
          # The key itself is valid at this point, so a failure here is the host key or authorized_keys.
          if ! ssh -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" true; then
            echo "::error::SSH to the server failed. 'Host key verification failed': STAGING_SSH_KNOWN_HOSTS is not this server's key (DEPLOY.md, step 3). 'Permission denied': the public half of STAGING_SSH_PRIVATE_KEY is not in /home/deploy/.ssh/authorized_keys."
            exit 1
          fi

      - name: Image names
        id: images
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha="$(git rev-parse HEAD)"
          {
            echo "api=$prefix/api:$sha"
            echo "migrate=$prefix/migrate:$sha"
            echo "web=$prefix/web:$sha"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: api
          push: true
          labels: com.nolon.stack=staging
          tags: ${{ steps.images.outputs.api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push migrate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: true
          labels: com.nolon.stack=staging
          tags: ${{ steps.images.outputs.migrate }}
          cache-from: |
            type=gha,scope=api
            type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

      - name: Build and push web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          labels: com.nolon.stack=staging
          tags: ${{ steps.images.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Write server .env
        env:
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          BASIC_AUTH_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          BASIC_AUTH_HASH: ${{ secrets.STAGING_BASIC_AUTH_HASH }}
          SEED_ADMIN_EMAIL: ${{ secrets.STAGING_SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.STAGING_SEED_ADMIN_PASSWORD }}
          BACKUP_AGE_RECIPIENT: ${{ vars.STAGING_BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_ENDPOINT: ${{ vars.STAGING_BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ vars.STAGING_BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ vars.STAGING_BACKUP_S3_REGION }}
          BACKUP_KEEP_DAYS: ${{ vars.STAGING_BACKUP_KEEP_DAYS }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.STAGING_BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.STAGING_BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          # Single quotes keep Compose from expanding the `$` signs inside the bcrypt hash.
          umask 077
          {
            echo "SITE_DOMAIN='$SITE_DOMAIN'"
            if [ -n "$LOCAL_PORT" ]; then
              echo "SITE_ADDRESS=':80'"
              echo "HTTP_BIND='127.0.0.1:$LOCAL_PORT'"
              echo "HTTPS_BIND='127.0.0.1:$((LOCAL_PORT + 1))'"
            else
              echo "SITE_ADDRESS='$SITE_DOMAIN'"
            fi
            echo "API_IMAGE='${{ steps.images.outputs.api }}'"
            echo "MIGRATE_IMAGE='${{ steps.images.outputs.migrate }}'"
            echo "WEB_IMAGE='${{ steps.images.outputs.web }}'"
            echo "POSTGRES_PASSWORD='$POSTGRES_PASSWORD'"
            echo "SEED_DEMO_DATA=true"
            # Tells backup.sh which stack it serves (compose file, bucket folder, cron time).
            echo "NOLON_STACK=staging"
            # Off-server backups (checked above: all or none; empty means not set up yet).
            echo "BACKUP_AGE_RECIPIENT='$BACKUP_AGE_RECIPIENT'"
            echo "BACKUP_S3_ENDPOINT='$BACKUP_S3_ENDPOINT'"
            echo "BACKUP_S3_BUCKET='$BACKUP_S3_BUCKET'"
            echo "BACKUP_S3_REGION='$BACKUP_S3_REGION'"
            echo "BACKUP_KEEP_DAYS='$BACKUP_KEEP_DAYS'"
            echo "BACKUP_S3_ACCESS_KEY_ID='$BACKUP_S3_ACCESS_KEY_ID'"
            echo "BACKUP_S3_SECRET_ACCESS_KEY='$BACKUP_S3_SECRET_ACCESS_KEY'"
            case "$ASSISTANT_URL" in
              *"'"*) echo "::error::STAGING_AGENT_ASSISTANT_URL must not contain a single quote"; exit 1 ;;
            esac
            echo "AGENT_ASSISTANT_URL='$ASSISTANT_URL'"
            # The first Administrator (checked above). The seed creates it only if missing.
            echo "SEED_ADMIN_EMAIL='$SEED_ADMIN_EMAIL'"
            echo "SEED_ADMIN_PASSWORD='$SEED_ADMIN_PASSWORD'"
            # Public only by explicit opt-in (STAGING_ALLOW_PUBLIC=true), whatever secrets exist.
            # Otherwise the secrets check above already required both values.
            if [ "$ALLOW_PUBLIC" = "true" ]; then
              echo "BASIC_AUTH=off"
            else
              echo "BASIC_AUTH=on"
              echo "BASIC_AUTH_USER='$BASIC_AUTH_USER'"
              echo "BASIC_AUTH_HASH='$BASIC_AUTH_HASH'"
            fi
          } > deploy/staging/.env

      - name: Copy files and deploy
        env:
          SSH_TARGET: ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Commands are built here on the runner and run on the server, in the deploy user's home.
          # shellcheck disable=SC2029 # expanding on the runner is the point
          remote() { ssh "$SSH_TARGET" "$1"; }
          dir="$DEPLOY_DIR"
          # Private directory first, then the secrets file created with mode 600 from the start, so no
          # other user on the shared server can read it, not even for a moment.
          remote "umask 077 && mkdir -p $dir && chmod 700 $dir"
          remote "umask 077 && cat > $dir/.env.tmp && mv $dir/.env.tmp $dir/.env" < deploy/staging/.env
          scp deploy/staging/docker-compose.staging.yml deploy/staging/Caddyfile \
            deploy/staging/deploy.sh "$SSH_TARGET:$dir/"
          # The backup tools are production's, shared (DEPLOY.md, Backups).
          (cd deploy/production && scp backup.sh backup-job.sh backup.Dockerfile "$SSH_TARGET:$dir/")
          # The job token can pull this repo's images only while the job runs; log out afterwards.
          printf '%s' "$GHCR_TOKEN" | remote "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          status=0
          remote "bash $dir/deploy.sh" || status=$?
          remote "docker logout ghcr.io" || true
          exit "$status"

      - name: Health check
        run: |
          # The first deploy waits for Let's Encrypt to issue the certificate.
          curl --fail --silent --show-error --retry 20 --retry-delay 6 --retry-all-errors \
            "https://$SITE_DOMAIN/api/v1/health"
          echo
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 5 --retry-all-errors \
            "https://$SITE_DOMAIN/ar")
          # Private (the default) must answer 401; 200 is accepted only when public was chosen.
          if [ "$ALLOW_PUBLIC" = "true" ]; then expected=200; else expected=401; fi
          echo "web /ar -> HTTP $code (expected $expected)"
          if [ "$code" != "$expected" ]; then
            echo "::error::https://$SITE_DOMAIN/ar answered $code, expected $expected"
            exit 1
          fi

      - name: Show container logs on failure
        # Only when SSH works; otherwise it would just repeat the SSH error.
        if: failure() && steps.ssh.outcome == 'success'
        env:
          SSH_TARGET: ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}
        run: |
          # $DEPLOY_DIR is meant to expand here, on the runner.
          # shellcheck disable=SC2029
          ssh "$SSH_TARGET" "cd ~/$DEPLOY_DIR && docker compose -f docker-compose.staging.yml ps -a && docker compose -f docker-compose.staging.yml logs --tail 80" || true
