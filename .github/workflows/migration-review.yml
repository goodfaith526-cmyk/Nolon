name: Migration review

# AGENTS.md rule 4: an additive migration merges on review and green CI; any other migration needs
# a tested backup and the owner's explicit OK, recorded as the `migration-signed-off` label. A push
# that changes migrations after the sign-off removes the label, so the OK covers what was reviewed.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: migration-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  additive:
    name: Migrations are additive or signed off
    runs-on: ubuntu-latest
    env:
      LABEL: migration-signed-off
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: A push that changes migrations withdraws the sign-off
        id: signoff
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ contains(github.event.pull_request.labels.*.name, 'migration-signed-off') }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          signed="$SIGNED"
          if [ "$signed" = "true" ] && [ "${{ github.event.action }}" = "synchronize" ]; then
            changed=$(git diff --name-only "$BEFORE" "$AFTER" -- apps/api/prisma/migrations 2>/dev/null || echo unknown)
            if [ -n "$changed" ]; then
              gh pr edit "$PR" --remove-label "$LABEL"
              echo "Migrations changed after the sign-off; label removed."
              signed=false
            fi
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
      - name: Review new migrations
        env:
          MIGRATION_SIGNED_OFF: ${{ steps.signoff.outputs.signed }}
        run: node apps/api/src/migration-review/additive-migrations.ts "origin/${{ github.base_ref }}"
